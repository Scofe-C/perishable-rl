# Optuna search space for a2c (adapted from RL Zoo). Values not listed keep configs/algo/a2c.yaml.
learning_rate: {type: float, low: 1.0e-5, high: 3.0e-3, log: true}
n_steps: {type: categorical, choices: [5, 8, 16, 32]}
gamma: {type: categorical, choices: [0.95, 0.98, 0.99, 0.995]}
gae_lambda: {type: categorical, choices: [0.9, 0.95, 1.0]}
ent_coef: {type: float, low: 1.0e-8, high: 1.0e-2, log: true}
