# Optuna search space for dqn (adapted from RL Zoo). Values not listed keep configs/algo/dqn.yaml.
learning_rate: {type: float, low: 1.0e-5, high: 1.0e-3, log: true}
batch_size: {type: categorical, choices: [32, 64, 128]}
gamma: {type: categorical, choices: [0.95, 0.98, 0.99, 0.995]}
train_freq: {type: categorical, choices: [1, 4, 8]}
target_update_interval: {type: categorical, choices: [500, 1000, 5000]}
exploration_fraction: {type: float, low: 0.05, high: 0.5}
exploration_final_eps: {type: float, low: 0.01, high: 0.1}
