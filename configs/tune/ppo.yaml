# Optuna search space for ppo (adapted from RL Zoo). param -> {type: float|int|categorical, low, high, log, choices}
# Values not listed keep configs/algo/ppo.yaml. Trial 0 is always the defaults.
learning_rate: {type: float, low: 1.0e-5, high: 1.0e-3, log: true}
n_steps: {type: categorical, choices: [128, 256, 512, 1024]}
batch_size: {type: categorical, choices: [64, 128, 256]}
n_epochs: {type: categorical, choices: [5, 10, 20]}
gamma: {type: categorical, choices: [0.95, 0.98, 0.99, 0.995]}
gae_lambda: {type: categorical, choices: [0.9, 0.95, 0.98]}
clip_range: {type: categorical, choices: [0.1, 0.2, 0.3]}
ent_coef: {type: float, low: 1.0e-8, high: 1.0e-2, log: true}
