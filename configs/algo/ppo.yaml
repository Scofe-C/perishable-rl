# Defaults before tuning (SB3 PPO defaults except n_steps/batch for 30-day episodes and 4 envs). Same net for all.
algo: ppo
policy: MlpPolicy
hparams:
  n_envs: 4
  n_steps: 512          # x 4 envs = 2048 steps per rollout
  batch_size: 256
  n_epochs: 10
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  net_arch: [64, 64]
