# Defaults before tuning. SB3 SAC defaults except the shared 64x64 net (DECISIONS: SAC cost is open;
# train_freq stays at the SB3 default 1 until the team decides).
algo: sac
policy: MlpPolicy
hparams:
  n_envs: 1
  learning_rate: 0.0003
  buffer_size: 200000
  learning_starts: 1000
  batch_size: 256
  tau: 0.005
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  net_arch: [64, 64]
